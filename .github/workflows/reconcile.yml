name: Puppets Reconcile

on:
  workflow_call:
    inputs:
      dry_run:
        description: Report intended mutations without applying them
        required: false
        default: false
        type: boolean
      caller_workflow:
        description: Caller workflow filename used for inbox reconciliation
        required: false
        default: puppets.yml
        type: string
    secrets:
      token:
        description: Optional repository-scoped token used when GITHUB_TOKEN cannot assign Copilot
        required: false
      anthropic_api_key:
        description: >-
          Anthropic API key for the `claude` implementation provider. Not required unless a
          workflow profile selects `implementation.provider: claude`. Alternative to
          claude_code_oauth_token.
        required: false
      claude_code_oauth_token:
        description: >-
          Claude Code OAuth token (from `claude setup-token`, for Claude Pro/Max plans) for the
          `claude` implementation provider. Alternative to anthropic_api_key.
        required: false
      openai_api_key:
        description: >-
          OpenAI API key for the `codex` implementation provider. Not required unless a
          workflow profile selects `implementation.provider: codex`.
        required: false
    outputs:
      waiting_count:
        description: Number of issues needing human attention
        value: ${{ jobs.reconcile.outputs.waiting_count }}
      waiting_message:
        description: Markdown summary of issues needing attention
        value: ${{ jobs.reconcile.outputs.waiting_message }}

permissions:
  actions: write
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    outputs:
      waiting_count: ${{ steps.reconcile.outputs.waiting_count }}
      waiting_message: ${{ steps.reconcile.outputs.waiting_message }}
      implementation_jobs: ${{ steps.reconcile.outputs.implementation_jobs }}
    steps:
      - name: Resolve framework revision
        id: framework
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('puppets-framework');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            const expectedWorkflow =
              'JeffSteinbok/puppets/.github/workflows/reconcile.yml@';
            if (!payload.job_workflow_ref?.startsWith(expectedWorkflow)) {
              core.setFailed(`Unexpected reusable workflow: ${payload.job_workflow_ref}`);
              return;
            }
            if (!/^[0-9a-f]{40}$/i.test(payload.job_workflow_sha || '')) {
              core.setFailed('GitHub did not provide the reusable workflow commit SHA.');
              return;
            }
            core.setOutput('ref', payload.job_workflow_sha);

      - name: Check out Puppets framework
        uses: actions/checkout@v4
        with:
          repository: JeffSteinbok/puppets
          ref: ${{ steps.framework.outputs.ref }}
          path: .puppets-framework
          persist-credentials: false

      - name: Check out caller default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.token || github.token }}
          path: .puppets-caller
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .puppets-framework/package-lock.json

      - name: Install locked runtime
        working-directory: .puppets-framework
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Resolve trusted configuration
        env:
          PUPPETS_FRAMEWORK_ROOT: .puppets-framework
          PUPPETS_CALLER_ROOT: .puppets-caller
          PUPPETS_RESOLVED_ROOT: .puppets-resolved
        run: node .puppets-framework/scripts/resolve-config.js

      - name: Reconcile labels
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          github-token: ${{ secrets.token || github.token }}
          script: |
            const fs = require('fs');
            const workflow = JSON.parse(fs.readFileSync('.puppets-resolved/workflow.json'));
            const specs = [
              ...workflow.stages
                .filter(stage => stage.label)
                .map(stage => ({
                  name: stage.label.name,
                  color: String(stage.label.color),
                  description: stage.label.description,
                })),
              ...workflow.controlLabels.map(({ name, color, description }) =>
                ({ name, color: String(color), description })),
              ...workflow.helperLabels.map(({ name, color, description }) =>
                ({ name, color: String(color), description })),
            ];
            const existing = new Map((await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { ...context.repo, per_page: 100 }
            )).map(label => [label.name, label]));
            for (const spec of specs) {
              const current = existing.get(spec.name);
              if (!current) {
                if (process.env.DRY_RUN !== 'true') {
                  await github.rest.issues.createLabel({ ...context.repo, ...spec });
                }
              } else if (current.color.toLowerCase() !== spec.color.toLowerCase() ||
                         (current.description || '') !== spec.description) {
                if (process.env.DRY_RUN !== 'true') {
                  await github.rest.issues.updateLabel({
                    ...context.repo,
                    name: spec.name,
                    color: spec.color,
                    description: spec.description,
                  });
                }
              }
            }

      - name: Reconcile lifecycle
        id: reconcile
        uses: actions/github-script@v9
        env:
          PUPPETS_OWNER: ${{ github.repository_owner }}
          PUPPETS_REPOSITORY: ${{ github.event.repository.name }}
          PUPPETS_INBOX_WORKFLOW_ID: ${{ inputs.caller_workflow }}
          PUPPETS_NODE_ROOT: .puppets-framework
          DRY_RUN: ${{ inputs.dry_run }}
          INBOX_FALLBACK_HOURS: "24"
          COPILOT_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.token || github.token }}
          script: |
            const reconcile = require('./.puppets-framework/src/reconcile.js');
            await reconcile({ github, context, core });

  # Runs only when `reconcile` queued at least one claude/codex implementation job (i.e. some
  # profile's implementation.provider is not the default `copilot`). Fully skipped — no
  # checkout, no secrets used, no cost — for every caller that only uses the built-in Copilot
  # provider, keeping that path exactly as it was before providers existed.
  #
  # Each matrix entry runs the requested provider action against a deterministic branch
  # (puppets/issue-<n>) checked out from the caller's default branch, then hands off to
  # scripts/finalize-implementation.js, which is the only thing that ever commits, pushes, or
  # opens/updates a pull request — neither provider action is trusted to do that itself. This
  # keeps the outcome of "assign" and "remediate" jobs identical regardless of which provider
  # produced the edits, and keeps the rest of the lifecycle (CI, acceptance review, merge)
  # completely provider-agnostic, since it only ever looks at the resulting pull request.
  implement:
    needs: reconcile
    if: needs.reconcile.outputs.implementation_jobs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.reconcile.outputs.implementation_jobs) }}
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Resolve framework revision
        id: framework
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('puppets-framework');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            const expectedWorkflow =
              'JeffSteinbok/puppets/.github/workflows/reconcile.yml@';
            if (!payload.job_workflow_ref?.startsWith(expectedWorkflow)) {
              core.setFailed(`Unexpected reusable workflow: ${payload.job_workflow_ref}`);
              return;
            }
            if (!/^[0-9a-f]{40}$/i.test(payload.job_workflow_sha || '')) {
              core.setFailed('GitHub did not provide the reusable workflow commit SHA.');
              return;
            }
            core.setOutput('ref', payload.job_workflow_sha);

      - name: Check out Puppets framework
        uses: actions/checkout@v4
        with:
          repository: JeffSteinbok/puppets
          ref: ${{ steps.framework.outputs.ref }}
          path: .puppets-framework
          persist-credentials: false

      # Checked out at the workspace root (rather than a subdirectory, unlike the `reconcile`
      # job) because anthropics/claude-code-action has no working-directory input and always
      # operates on $GITHUB_WORKSPACE. `clean: false` is required so this checkout does not
      # delete the framework checkout that already lives at .puppets-framework.
      - name: Check out caller default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.token || github.token }}
          clean: false

      - name: Prepare implementation branch
        env:
          PUPPETS_BRANCH: ${{ matrix.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$PUPPETS_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PUPPETS_BRANCH"
            git checkout -B "$PUPPETS_BRANCH" "origin/$PUPPETS_BRANCH"
          else
            git checkout -B "$PUPPETS_BRANCH"
          fi

      # For a fresh assignment, the prompt is exactly what a human already sees: the issue's
      # own title/body plus the implementation-instructions comment already posted on it (base
      # prompt + any repo-owned per-repo guidance). For a remediation retry, the reconciler's
      # own directive text (conflict or acceptance-review remediation) is used as-is via
      # matrix.directive instead of re-reading the issue.
      - name: Build implementation prompt
        id: prompt
        if: matrix.mode == 'assign'
        uses: actions/github-script@v9
        env:
          PUPPETS_ISSUE_NUMBER: ${{ matrix.issueNumber }}
        with:
          github-token: ${{ secrets.token || github.token }}
          script: |
            const { IMPLEMENTATION_MARKER } = require('./.puppets-framework/src/providers/markers.js');
            const { buildAssignPrompt } = require('./.puppets-framework/src/providers/implementation-job.js');
            const issueNumber = Number.parseInt(process.env.PUPPETS_ISSUE_NUMBER, 10);
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: issueNumber });
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: issueNumber, per_page: 100,
            });
            const instructions = comments.find(c => c.body?.includes(IMPLEMENTATION_MARKER))?.body || '';
            core.setOutput('text', buildAssignPrompt({
              issueNumber, issueTitle: issue.title, issueBody: issue.body, instructions,
            }));

      - name: Run Claude Code
        if: matrix.provider == 'claude'
        # anthropics/claude-code-action v1 tag, pinned to its resolved commit.
        uses: anthropics/claude-code-action@9db594c7a0e82298c121c18b7f08aa1579ce7341
        with:
          prompt: ${{ matrix.mode == 'assign' && steps.prompt.outputs.text || matrix.directive }}
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ secrets.token || github.token }}
          # The action has no dedicated model input; a model override is passed the same
          # way the Claude Code CLI itself supports, via the "model" key of its settings.json.
          settings: ${{ matrix.model != '' && format('{{"model":{0}}}', toJSON(matrix.model)) || '' }}

      - name: Run Codex
        if: matrix.provider == 'codex'
        # openai/codex-action v1 tag, pinned to its resolved commit.
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56
        with:
          prompt: ${{ matrix.mode == 'assign' && steps.prompt.outputs.text || matrix.directive }}
          openai-api-key: ${{ secrets.openai_api_key }}
          model: ${{ matrix.model }}
          sandbox: workspace-write
          allow-bots: true

      - name: Finalize implementation
        uses: actions/github-script@v9
        env:
          PUPPETS_JOB_REPO: ${{ matrix.repo }}
          PUPPETS_JOB_ISSUE_NUMBER: ${{ matrix.issueNumber }}
          PUPPETS_JOB_PR_NUMBER: ${{ matrix.prNumber }}
          PUPPETS_JOB_PROVIDER: ${{ matrix.provider }}
          PUPPETS_JOB_MODE: ${{ matrix.mode }}
          PUPPETS_JOB_BRANCH: ${{ matrix.branch }}
          PUPPETS_CALLER_ROOT: .
        with:
          github-token: ${{ secrets.token || github.token }}
          script: |
            const finalize = require('./.puppets-framework/scripts/finalize-implementation.js');
            await finalize({ github, context, core });
