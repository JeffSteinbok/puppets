name: Puppets

on:
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report intended mutations without applying them
        required: false
        default: false
        type: boolean

concurrency:
  group: puppets-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  reconcile:
    uses: JeffSteinbok/puppets/.github/workflows/reconcile.yml@ea5d690a984964fc6a32500a7185f6cd0d33ac78
    with:
      dry_run: ${{ inputs.dry_run || false }}
      caller_workflow: puppets.yml
