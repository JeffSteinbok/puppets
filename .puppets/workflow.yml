spec:
  labels:
    helpers:
      - name: provider:claude
        color: "D97706"
        description: Use Claude Code for issue implementation.

  profiles:
    # Implement approved issues with Claude Code by default.
    - name: basic
      implementation:
        provider: claude

    - name: claude-test
      default: false
      priority: 100
      selector:
        allLabels: [provider:claude]
      routes:
        approved: claim
      implementation:
        prompt: implementation
        guidance: implementation
        heading: Puppets implementation instructions
        provider: claude
